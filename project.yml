name: Copybara
options:
  bundleIdPrefix: dev.ustinoff
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

fileGroups:
  - project.yml
  - README.md
  - docs

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.9.0"

targets:
  Copybara:
    type: application
    platform: macOS
    sources:
      - path: Copybara
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Copybara
        PRODUCT_BUNDLE_IDENTIFIER: dev.ustinoff.copybara
        INFOPLIST_FILE: Copybara/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  CopybaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CopybaraTests
    dependencies:
      - target: Copybara
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Copybara.app/Contents/MacOS/Copybara"
        # Tests only run on modern macOS; avoids XCTest "built for newer version" warnings.
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  Copybara:
    build:
      targets:
        Copybara: all
        CopybaraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CopybaraTests
