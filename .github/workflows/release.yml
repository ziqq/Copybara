name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Version '${VERSION}' is not semver"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          COPYBARA_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/build_dmg.sh

      - name: Package
        id: package
        run: |
          # build_dmg.sh already names the file with the version.
          NAME="Copybara-${{ steps.meta.outputs.version }}.dmg"
          DMG="build/${NAME}"
          [ -f "$DMG" ] || { echo "::error::${DMG} not found"; exit 1; }
          # Sums by bare file name, so they verify next to the downloaded asset.
          (cd build && shasum -a 256 "$NAME") > SHA256SUMS.txt
          BYTES=$(stat -f%z "$DMG")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "size=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; HEADING="Changes since ${PREV}"; else RANGE=""; HEADING="First release"; fi
          {
            echo "A fast, keyboard-first, privacy-respecting clipboard manager for macOS."
            echo
            echo "## Install"
            echo
            echo "1. Download **${{ steps.package.outputs.name }}** and open it."
            echo "2. Drag **Copybara** onto **Applications**."
            echo "3. Clear the quarantine flag (the build is ad-hoc signed — no paid Apple"
            echo "   Developer account yet — so Gatekeeper blocks it otherwise):"
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/Copybara.app"
            echo '```'
            echo
            echo "4. Launch it and grant Accessibility on the first paste. Requires macOS 12+."
            echo
            echo "> **After updating**, macOS treats the new ad-hoc build as a different app:"
            echo "> in System Settings › Privacy & Security › Accessibility, remove Copybara"
            echo "> with **−** and enable it again, or pasting stays off."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| ${{ steps.package.outputs.name }} | ${{ steps.package.outputs.size }} | \`${{ steps.package.outputs.sha }}\` |"
            echo
            echo "**Alternative — build from source:** clone the repo, \`brew install xcodegen\`,"
            echo "then \`./scripts/build_dmg.sh\` (writes \`build/Copybara-<version>.dmg\`)."
            echo
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${RANGE} | head -100
            echo
            echo "## Checksum"
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS.txt` next to the download.'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Copybara ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.package.outputs.path }}" \
            SHA256SUMS.txt \
            --title "Copybara ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md

  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release result
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.release.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
