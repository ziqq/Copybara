name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Resolve version and tag
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Releases require an existing v* tag; select the tag when running this workflow."
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Version '${VERSION}' is not semver"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Copybara signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA1: ${{ vars.DEVELOPER_ID_CERTIFICATE_SHA1 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?DEVELOPER_ID_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?DEVELOPER_ID_CERTIFICATE_PASSWORD is required}"
          : "${CERTIFICATE_SHA1:?DEVELOPER_ID_CERTIFICATE_SHA1 is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required}"
          [[ "$CERTIFICATE_SHA1" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "Invalid signing certificate SHA1"; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Invalid Apple team ID"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/copybara-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERTIFICATE="$RUNNER_TEMP/copybara-signing.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ISSUER="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$ISSUER"
          printf '%s  %s\n' f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a "$ISSUER" | shasum -a 256 -c -
          security import "$ISSUER" -k "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -Ei "${CERTIFICATE_SHA1} \"Developer ID Application:.*\(${APPLE_TEAM_ID}\)\""

      - name: Build and notarize DMG
        env:
          COPYBARA_VERSION: ${{ steps.meta.outputs.version }}
          COPYBARA_BUILD_NUMBER: ${{ github.run_number }}
          COPYBARA_CODE_SIGN_IDENTITY: ${{ vars.DEVELOPER_ID_CERTIFICATE_SHA1 }}
          COPYBARA_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          COPYBARA_NOTARIZE: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build_dmg.sh

      - name: Check signature survives a version change
        env:
          COPYBARA_CODE_SIGN_IDENTITY: ${{ vars.DEVELOPER_ID_CERTIFICATE_SHA1 }}
          COPYBARA_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/Copybara.app"
          NEXT="$RUNNER_TEMP/Copybara-next.app"
          ditto "$APP" "$NEXT"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 999999' "$NEXT/Contents/Info.plist"
          codesign --force --sign "$COPYBARA_CODE_SIGN_IDENTITY" --options runtime --timestamp "$NEXT"
          python3 scripts/verify_signing.py "$APP" --identity "$COPYBARA_CODE_SIGN_IDENTITY" --team-id "$COPYBARA_TEAM_ID" --reference "$NEXT"

      - name: Package
        id: package
        run: |
          # build_dmg.sh already names the file with the version.
          NAME="Copybara-${{ steps.meta.outputs.version }}.dmg"
          DMG="build/${NAME}"
          [ -f "$DMG" ] || { echo "::error::${DMG} not found"; exit 1; }
          # Sums by bare file name, so they verify next to the downloaded asset.
          (cd build && shasum -a 256 "$NAME") > SHA256SUMS.txt
          BYTES=$(stat -f%z "$DMG")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "size=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')" >> "$GITHUB_OUTPUT"

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY is not configured"; exit 1; }
          TOOLS="$RUNNER_TEMP/sparkle"
          mkdir -p "$TOOLS"
          curl -fL --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$TOOLS/Sparkle.tar.xz"
          tar -xJf "$TOOLS/Sparkle.tar.xz" -C "$TOOLS"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ziqq/Copybara/releases/download/$TAG/" \
            build
          [ -s build/appcast.xml ] || { echo "::error::appcast.xml was not generated"; exit 1; }

      - name: Release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; HEADING="Changes since ${PREV}"; else RANGE=""; HEADING="First release"; fi
          {
            echo "A fast, keyboard-first, privacy-respecting clipboard manager for macOS."
            echo
            echo "## Install"
            echo
            echo "1. Download **${{ steps.package.outputs.name }}** and open it."
            echo "2. Drag **Copybara** onto **Applications**."
            echo "3. Launch it and grant Accessibility on the first paste. Requires macOS 12+."
            echo
            echo "The app and DMG are signed with Developer ID Application and notarized by Apple."
            echo "Both include a stapled ticket, verified before publication."
            echo
            echo "**Updates:** this version includes an in-app installer. From the next release,"
            echo "choose Check for Updates, then Install Update — Copybara verifies the update,"
            echo "replaces the app and relaunches. Versions before 0.1.3 need one manual install."
            echo
            echo "> **Migrating from an Apple Development or ad-hoc release:** the signing"
            echo "> requirement changes. If pasting stops, remove Copybara from System Settings"
            echo "> › Privacy & Security › Accessibility with **−**, then add the installed app again."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| ${{ steps.package.outputs.name }} | ${{ steps.package.outputs.size }} | \`${{ steps.package.outputs.sha }}\` |"
            echo
            echo "**Alternative — build from source:** clone the repo, \`brew install xcodegen\`,"
            echo "then \`./scripts/build_dmg.sh\` (writes \`build/Copybara-<version>.dmg\`)."
            echo
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${RANGE} | head -100
            echo
            echo "## Checksum"
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS.txt` next to the download.'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.package.outputs.path }}" \
            build/appcast.xml \
            SHA256SUMS.txt \
            --verify-tag \
            --title "Copybara ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md

      - name: Save notarization receipts
        if: always() && hashFiles('build/notarization/**/*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/notarization/**/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/copybara-signing.p12"
          if [ -f "$RUNNER_TEMP/copybara-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/copybara-signing.keychain-db"
          fi

  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release result
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.release.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
