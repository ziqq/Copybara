name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Version '${VERSION}' is not semver"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Import Copybara signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE_BASE64:?APPLE_SIGNING_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?APPLE_SIGNING_CERTIFICATE_PASSWORD is required}"
          KEYCHAIN="$RUNNER_TEMP/copybara-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERTIFICATE="$RUNNER_TEMP/copybara-signing.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          ISSUER="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$ISSUER"
          printf '%s  %s\n' dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f "$ISSUER" | shasum -a 256 -c -
          security import "$ISSUER" -k "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build DMG
        env:
          COPYBARA_VERSION: ${{ steps.meta.outputs.version }}
          COPYBARA_BUILD_NUMBER: ${{ github.run_number }}
          COPYBARA_CODE_SIGN_IDENTITY: 2A1CD7C372968E01732ED7B26AC5CBB9F4014D33
        run: ./scripts/build_dmg.sh

      - name: Check signature survives a version change
        env:
          COPYBARA_CODE_SIGN_IDENTITY: 2A1CD7C372968E01732ED7B26AC5CBB9F4014D33
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release/Copybara.app"
          NEXT="$RUNNER_TEMP/Copybara-next.app"
          ditto "$APP" "$NEXT"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 999999' "$NEXT/Contents/Info.plist"
          codesign --force --sign "$COPYBARA_CODE_SIGN_IDENTITY" "$NEXT"
          python3 scripts/verify_signing.py "$APP" --identity "$COPYBARA_CODE_SIGN_IDENTITY" --reference "$NEXT"

      - name: Package
        id: package
        run: |
          # build_dmg.sh already names the file with the version.
          NAME="Copybara-${{ steps.meta.outputs.version }}.dmg"
          DMG="build/${NAME}"
          [ -f "$DMG" ] || { echo "::error::${DMG} not found"; exit 1; }
          # Sums by bare file name, so they verify next to the downloaded asset.
          (cd build && shasum -a 256 "$NAME") > SHA256SUMS.txt
          BYTES=$(stat -f%z "$DMG")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "size=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')" >> "$GITHUB_OUTPUT"

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY is not configured"; exit 1; }
          TOOLS="$RUNNER_TEMP/sparkle"
          mkdir -p "$TOOLS"
          curl -fL --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$TOOLS/Sparkle.tar.xz"
          tar -xJf "$TOOLS/Sparkle.tar.xz" -C "$TOOLS"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ziqq/Copybara/releases/download/$TAG/" \
            build
          [ -s build/appcast.xml ] || { echo "::error::appcast.xml was not generated"; exit 1; }

      - name: Release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; HEADING="Changes since ${PREV}"; else RANGE=""; HEADING="First release"; fi
          {
            echo "A fast, keyboard-first, privacy-respecting clipboard manager for macOS."
            echo
            echo "## Install"
            echo
            echo "1. Download **${{ steps.package.outputs.name }}** and open it."
            echo "2. Drag **Copybara** onto **Applications**."
            echo "3. This build uses Apple Development signing and is not notarized."
            echo "   If macOS blocks the first launch, clear the quarantine flag:"
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/Copybara.app"
            echo '```'
            echo
            echo "4. Launch it and grant Accessibility on the first paste. Requires macOS 12+."
            echo
            echo "**Updates:** this version includes an in-app installer. From the next release,"
            echo "choose Check for Updates, then Install Update — Copybara verifies the update,"
            echo "replaces the app and relaunches. Versions before 0.1.3 need one manual install."
            echo
            echo "> **Migrating from 0.1.5 or earlier:** remove Copybara from System Settings"
            echo "> › Privacy & Security › Accessibility with **−**, then add the installed"
            echo "> app again. Version 0.1.6 replaces ad-hoc signing with a stable certificate."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| ${{ steps.package.outputs.name }} | ${{ steps.package.outputs.size }} | \`${{ steps.package.outputs.sha }}\` |"
            echo
            echo "**Alternative — build from source:** clone the repo, \`brew install xcodegen\`,"
            echo "then \`./scripts/build_dmg.sh\` (writes \`build/Copybara-<version>.dmg\`)."
            echo
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty='- %s (%h)' ${RANGE} | head -100
            echo
            echo "## Checksum"
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS.txt` next to the download.'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Copybara ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.package.outputs.path }}" \
            build/appcast.xml \
            SHA256SUMS.txt \
            --title "Copybara ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md

      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/copybara-signing.p12"
          if [ -f "$RUNNER_TEMP/copybara-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/copybara-signing.keychain-db"
          fi

  complete-issues:
    name: Complete issues after successful publication
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release result
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "status_label": ${{ toJSON(needs.release.result) }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
