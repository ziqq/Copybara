name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Copybara.xcodeproj \
            -scheme Copybara \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean test \
            | xcbeautify --report junit --report-path .build/reports

      - name: Test report summary
        if: success() || failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          fails = []
          for path in glob.glob(".build/reports/junit.xml"):
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  total += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
                  for case in suite.iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          fails.append(f'{case.get("classname","")}.{case.get("name","")}')
          passed = total - failed - skipped
          print("## 🧪 Test report\n")
          print("| Total | ✅ Passed | ❌ Failed | ⏭️ Skipped |")
          print("| ---: | ---: | ---: | ---: |")
          print(f"| {total} | {passed} | {failed} | {skipped} |")
          if fails:
              print("\n**Failures**\n")
              for name in fails:
                  print(f"- `{name}`")
          PY

      - name: Generate coverage report
        if: success()
        run: |
          gem install slather --no-document
          slather coverage --cobertura-xml

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: .build/coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ziqq/Copybara
          flags: macos
          fail_ci_if_error: false
          verbose: true
