name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Copybara.xcodeproj \
            -scheme Copybara \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean test \
            | xcbeautify --report junit --report-path .build/reports

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test report
          path: .build/reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate coverage report
        if: success()
        run: |
          gem install slather --no-document
          slather coverage --cobertura-xml

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: .build/coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ziqq/Copybara
          flags: macos
          fail_ci_if_error: false
          verbose: true
