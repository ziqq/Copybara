name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Copybara.xcodeproj \
            -scheme Copybara \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean test \
            | xcbeautify --report junit --report-path .build/reports

      - name: Test report summary
        if: success() || failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          fails = []
          for path in glob.glob(".build/reports/junit.xml"):
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  total += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
                  for case in suite.iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          fails.append(f'{case.get("classname","")}.{case.get("name","")}')
          passed = total - failed - skipped
          print("## 🧪 Test report\n")
          print("| Total | ✅ Passed | ❌ Failed | ⏭️ Skipped |")
          print("| ---: | ---: | ---: | ---: |")
          print(f"| {total} | {passed} | {failed} | {skipped} |")
          if fails:
              print("\n**Failures**\n")
              for name in fails:
                  print(f"- `{name}`")
          PY

      - name: Generate coverage report
        if: success()
        run: |
          gem install slather --no-document
          slather coverage --cobertura-xml

      - name: Upload coverage to Codecov
        if: success()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          # Codecov CLI via curl — no Node-based action (avoids the Node 20 warning).
          curl -Os https://cli.codecov.io/latest/macos/codecov
          chmod +x codecov
          ./codecov upload-process \
            --slug ziqq/Copybara \
            --file .build/coverage/cobertura.xml \
            --flag macos || echo "Codecov upload skipped/failed (non-fatal)"

  notify:
    name: Notify CI result
    needs: build-test
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Report missing notification secrets
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS == '' ||
          env.NOTIFY_TELEGRAM_BOT_TOKEN == '' ||
          env.NOTIFY_TELEGRAM_TARGETS == ''
        shell: bash
        run: >-
          echo "::warning::CI notification skipped because one or more notification secrets are not configured."

      - name: Checkout trusted notification template
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Notify Discord and Telegram
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(needs.build-test.result) }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
